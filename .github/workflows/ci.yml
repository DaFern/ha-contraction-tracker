name: "Development checks"
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  hassfest:
    name: "hassfest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: "Validate integration metadata and resources"
        uses: home-assistant/actions/hassfest@master
  hacs:
    name: "HACS / Marketplace validation"
    runs-on: ubuntu-latest
    steps:
      - name: "Validate catalog requirements without ignored checks"
        uses: hacs/action@main
        with:
          category: "integration"
          comment: "false"
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - run: python3 tools/build_assets.py
      - run: python3 -m unittest discover -s tests/unit -v
      - run: npm test
      - run: python3 tools/check_release.py
      - run: python3 tools/build_release.py
  native-ha-tests:
    name: "Native HA ${{ matrix.ha_version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha_version:
          - "2026.11.0"
          - "2026.11.3"
    env:
      HA_TEST_VERSION: "${{ matrix.ha_version }}"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"
      - name: "Install matched Home Assistant and official test package"
        run: python -m pip install -r requirements-ha-test.txt "pytest-homeassistant==${HA_TEST_VERSION}" "homeassistant==${HA_TEST_VERSION}"
      - name: "Install the frontend version required by the tested Home Assistant"
        run: |
          python - <<'PY'
          from importlib.resources import files
          import json
          import subprocess
          import sys

          manifest = json.loads(
              files("homeassistant").joinpath("components", "frontend", "manifest.json").read_text()
          )
          requirements = [
              item for item in manifest["requirements"]
              if item.startswith("home-assistant-frontend==")
          ]
          assert len(requirements) == 1, "Expected one exact HA frontend requirement"
          print("Installing HA's declared frontend requirement:", requirements[0], flush=True)
          subprocess.run([sys.executable, "-m", "pip", "install", *requirements], check=True)
          PY
      - name: "Verify exact test targets and dependency consistency"
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import os
          from homeassistant.const import __version__

          expected = os.environ["HA_TEST_VERSION"]
          plugin = version("pytest-homeassistant")
          print("Requested Home Assistant:", expected)
          print("Installed Home Assistant:", __version__)
          print("Installed official test package:", plugin)
          assert __version__ == expected, "Home Assistant differs from the matrix target"
          assert plugin == expected, "Test package differs from the matrix target"
          PY
          python -m pip check
      - run: pytest tests/ha -v
